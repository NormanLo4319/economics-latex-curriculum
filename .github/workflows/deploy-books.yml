name: Deploy E-Textbooks to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Convert LaTeX to Quarto Markdown
        run: |
          python convert_to_quarto.py

      - name: Render Microeconomics Textbook
        run: |
          cd web_books/microeconomics
          quarto render

      - name: Render Macroeconomics Textbook
        run: |
          cd web_books/macroeconomics
          quarto render

      - name: Generate Landing Page Router
        run: |
          mkdir -p dist/web
          cat << 'EOF' > dist/web/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Principles of Economics E-Textbooks</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 80vh; margin: 0; background: #f8fafc; }
              .card { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 480px; }
              h1 { color: #1e293b; font-size: 1.5rem; margin-bottom: 1.5rem; }
              a { display: block; padding: 0.75rem 1.25rem; margin: 0.75rem 0; border-radius: 6px; text-decoration: none; font-weight: 600; color: white; background: #0284c7; }
              a.macro { background: #0f766e; }
              a:hover { opacity: 0.9; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Principles of Economics Curriculum</h1>
              <a href="./micro/index.html">Principles of Microeconomics</a>
              <a href="./macro/index.html" class="macro">Principles of Macroeconomics</a>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/web
