name: Deploy E-Textbooks to Public GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "web_books/**"
      - ".github/workflows/deploy-books.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-books
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source repository
        uses: actions/checkout@v4

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean web output directory
        run: |
          rm -rf dist/web
          mkdir -p dist/web

      - name: Render Microeconomics Web-Book
        run: quarto render web_books/microeconomics

      - name: Render Macroeconomics Web-Book
        run: quarto render web_books/macroeconomics

      - name: Copy landing page and disable Jekyll
        run: |
          cp web_books/index.html dist/web/index.html
          touch dist/web/.nojekyll

      - name: Verify rendered site structure
        run: |
          test -f dist/web/index.html
          test -f dist/web/micro/index.html
          test -f dist/web/macro/index.html

      - name: Deploy static HTML to public GitHub Pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: ${{ vars.PUBLIC_PAGES_REPO || 'NormanLo4319/economics-web-book' }}
          publish_branch: main
          publish_dir: ./dist/web
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy web-books from ${{ github.sha }}"
